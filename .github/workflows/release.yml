name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: applauncher

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows support is planned but not active yet. To enable it,
          # uncomment the entry below — everything downstream (deps install,
          # build, packaging, upload) already branches on OS/target, so this
          # is the only line that needs to change.
          # - target: x86_64-pc-windows-msvc
          #   os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install egui/eframe system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libspeechd-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libgtk-3-dev

      - name: Install aarch64 cross-compiler (Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        id: package_unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="${BIN_NAME}-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$staging/"
          cp README.md "$staging/" 2>/dev/null || true
          cp LICENCE.md "$staging/" 2>/dev/null || true
          tar czf "${staging}.tar.gz" "$staging"
          echo "asset=${staging}.tar.gz" >> "$GITHUB_OUTPUT"

      # Windows packaging is pre-wired for when the target above is enabled.
      # PowerShell zips the binary + docs into a .zip, matching the
      # convention most Rust CLI/GUI projects use for Windows releases.
      - name: Package (Windows)
        id: package_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "${env:BIN_NAME}-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${env:BIN_NAME}.exe" -Destination $staging
          if (Test-Path README.md) { Copy-Item README.md -Destination $staging }
          if (Test-Path LICENCE.md) { Copy-Item LICENCE.md -Destination $staging }
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          echo "asset=$staging.zip" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_unix.outputs.asset || steps.package_windows.outputs.asset }}
          path: ${{ steps.package_unix.outputs.asset || steps.package_windows.outputs.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
